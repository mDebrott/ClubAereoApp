spring.application.name=vuelos-service
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vuelos}
spring.datasource.username=${DB_USER:clubaereo}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago

# URLs de los otros microservicios
clients.pasajero.url=${PASAJERO_URL:http://localhost:8082}
clients.aeronaves.url=${AERONAVES_URL:http://localhost:8081}
