spring.application.name=pasajero-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pasajero}
spring.datasource.username=${DB_USER:clubaereo}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago
