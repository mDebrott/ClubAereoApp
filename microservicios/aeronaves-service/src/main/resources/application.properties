spring.application.name=aeronaves-service
server.port=8081

# Base de datos (valores por defecto para desarrollo local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aeronaves}
spring.datasource.username=${DB_USER:clubaereo}
spring.datasource.password=${DB_PASSWORD:}

# En desarrollo: "update". En producción usar Flyway/Liquibase + "validate"
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago
